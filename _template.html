<style>
  :root{--max:1120px;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
  
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px;position:relative;z-index:2}
  a{color:inherit;text-decoration:none}
  .eyebrow{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:0.26em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;display:block}
  h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-0.03em;line-height:1.04}

  nav{position:sticky;top:0;z-index:10;background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:74px}
  .logo{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-0.02em}
  .logo span{color:var(--accent)}
  .nav-links{display:flex;align-items:center;gap:28px}
  .nav-links a:not(.btn){color:var(--muted);font-size:15px;font-weight:500;transition:color .2s}
  .nav-links a:not(.btn):hover{color:var(--ink)}
  .btn{display:inline-block;font-family:var(--display);font-weight:600;font-size:15px;padding:12px 22px;transition:transform .2s,background .2s,border-color .2s;border:none;cursor:pointer}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-ghost{border:1px solid var(--hairline-2);color:var(--ink);background:none}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

  header{padding:44px 0 90px;border-bottom:1px solid var(--hairline)}
  header h1{font-size:clamp(2.7rem,7vw,5rem);font-weight:700;max-width:16ch;margin-bottom:24px}
  header .sub{color:var(--muted);font-size:clamp(1.05rem,2vw,1.3rem);max-width:52ch;margin-bottom:32px}

  section{padding:96px 0;border-bottom:1px solid var(--hairline)}
  .sec-head{max-width:60ch;margin-bottom:14px}
  .sec-head h2{font-size:clamp(2rem,4.5vw,3.1rem);margin-bottom:14px}
  .sec-head p{color:var(--muted);font-size:1.08rem}

  footer{padding:52px 0;border-top:1px solid var(--hairline)}
  .foot-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
  .socials{display:flex;gap:20px}
  .socials a{color:var(--muted);font-size:14px;font-weight:500}
  .socials a:hover{color:var(--accent)}
  .foot-in p{color:var(--muted);font-size:14px}
  .foot-legal{display:flex;justify-content:center;gap:18px;width:100%;border-top:1px solid var(--hairline);padding-top:16px}
  .foot-legal a{color:var(--muted);font-size:13px}
  .foot-legal a:hover{color:var(--accent)}

  @media(max-width:860px){
    .nav-links a:not(.btn){display:none}
    header{padding:30px 0 60px}
    section{padding:66px 0}
  }
</style>
