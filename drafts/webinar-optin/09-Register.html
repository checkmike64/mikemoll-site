<style>
@import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap');
.wbreg{
  --ink:#27323D;--slate:#4E6F8A;--slate2:#607179;--sky:#38B6FF;--skybg:#EAF6FF;
  background:var(--skybg);font-family:'Poppins',system-ui,sans-serif;color:var(--ink);box-sizing:border-box;
}
.wbreg *{box-sizing:border-box}
.wbreg .anchor{position:relative;top:-100px}
.wbreg .in{max-width:600px;margin:0 auto;padding:64px 28px;text-align:center}
.wbreg h2{font-family:'League Spartan',sans-serif;font-weight:700;letter-spacing:normal;font-size:34px;line-height:1.1;margin:0}
.wbreg .when{display:inline-block;margin-top:14px;font-size:14px;font-weight:600;color:var(--ink);line-height:1.5;max-width:460px}
.wbreg .formbox{background:#fff;border:2px dashed #9FCBE6;border-radius:18px;padding:44px 24px;margin-top:22px;color:var(--slate2);font-size:14px;font-weight:600}
.wbreg .next{font-size:13px;font-weight:500;color:var(--slate2);margin-top:16px;line-height:1.5}
@media(max-width:760px){.wbreg .in{padding:48px 20px}.wbreg h2{font-size:27px}}
</style>

<div class="wbreg">
  <span id="register" class="anchor"></span>
  <div class="in">
    <h2>Save your seat.</h2>
    <div class="when">Live Wednesday, August 12 at 4:00 PM ET. It's a free workshop, and it's live, so you can ask your questions in the room. Seats are limited.</div>
    <div class="formbox">[ Your GoHighLevel registration form goes here ]</div>
    <div class="next">Register with your name and email. We'll send the link, plus a reminder before we go live.</div>
  </div>
</div>
