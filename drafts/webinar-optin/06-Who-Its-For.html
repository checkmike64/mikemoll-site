<style>
@import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap');
.wbwho{
  --ink:#27323D;--slate:#4E6F8A;--line:#E7EBEF;
  font-family:'Poppins',system-ui,sans-serif;color:var(--ink);max-width:960px;margin:0 auto;padding:64px 28px;text-align:center;box-sizing:border-box;
}
.wbwho *{box-sizing:border-box}
.wbwho h2{font-family:'League Spartan',sans-serif;font-weight:700;letter-spacing:normal;font-size:32px;line-height:1.12;margin:0 auto 30px;max-width:560px}
.wbwho .buckets{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;text-align:left}
.wbwho .bkt{background:#F7F9FA;border:1px solid var(--line);border-radius:16px;padding:20px 16px}
.wbwho .bkt .bt{font-family:'League Spartan',sans-serif;font-weight:700;font-size:16.5px;color:var(--ink)}
.wbwho .bkt .bd{font-size:12.5px;font-weight:400;color:var(--slate);line-height:1.45;margin-top:6px}
@media(max-width:760px){.wbwho{padding:48px 20px}.wbwho h2{font-size:27px}.wbwho .buckets{grid-template-columns:1fr 1fr}}
</style>

<div class="wbwho">
  <h2>Who this workshop is for</h2>
  <div class="buckets">
    <div class="bkt"><div class="bt">Coaches</div><div class="bd">Get in front of the people who need your help.</div></div>
    <div class="bkt"><div class="bt">Consultants</div><div class="bd">Turn your expertise into inbound leads.</div></div>
    <div class="bkt"><div class="bt">Agency owners</div><div class="bd">Win clients without cold outreach.</div></div>
    <div class="bkt"><div class="bt">Authors</div><div class="bd">Put your book and ideas in front of new readers.</div></div>
    <div class="bkt"><div class="bt">Speakers</div><div class="bd">Build the reputation that fills your calendar.</div></div>
  </div>
</div>
