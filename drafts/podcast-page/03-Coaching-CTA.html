<style>
@import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap');
.pucta{
  --ink:#27323D;--slate:#4E6F8A;--sky:#38B6FF;--skyd:#1E9BE6;--line:#E7EBEF;
  font-family:'Poppins',system-ui,sans-serif;max-width:920px;margin:0 auto;padding:44px 28px;box-sizing:border-box;
}
.pucta *{box-sizing:border-box}
.pucta .bubble{background:#27323D;border-radius:28px;padding:52px 40px;text-align:center}
.pucta h2{font-family:'League Spartan',sans-serif;font-weight:700;font-size:31px;line-height:1.12;color:#fff;margin:0 auto;max-width:560px}
.pucta p{font-size:16px;font-weight:400;color:#AEC1D2;line-height:1.55;margin:14px auto 0;max-width:480px}
.pucta .btn{display:inline-flex;align-items:center;gap:9px;background:var(--sky);color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:16px;text-decoration:none;border-radius:999px;padding:14px 30px;margin-top:28px;transition:background .15s ease}
.pucta .btn:hover{background:var(--skyd)}
.pucta .btn svg{width:16px;height:16px}
