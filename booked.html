<script>
// The CRM sends people here after they book a call. The address says what
// they booked: the meeting type (type), its name, when it starts (at), the
// meeting's id, and the visitor key, which /visits.js deals with. Every value
// is checked before it is used and only ever written into the page as text.
// Without a usable time and name, the page shows the general confirmation.
//
// book_appointment goes to Tag Manager once per booking: the meeting id is
// the CRM's own id for it, and this browser remembers the last 20 it has
// counted. The id then comes out of the address bar, so a reload still shows
// the time but is not a second booking. A visit with no id is not a booking
// and pushes nothing.
(function () {
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  var TYPE = /^[a-z0-9-]{1,80}$/;
  var SEEN = 'crm_booked';
  var params = new URLSearchParams(location.search);

  var type = params.get('type') || '';
  if (!TYPE.test(type)) type = '';
  var name = (params.get('name') || '').trim();
  if (name.length > 120) name = '';
  var at = params.get('at') ? new Date(params.get('at')) : null;
  if (at && isNaN(at.getTime())) at = null;
  var id = params.get('id') || '';

  // "Saturday, October 3 at 3:00 pm (America/New York)", in the visitor's own
  // time zone.
  function describe(date) {
    var zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (!zone) return '';
    var parts = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: zone,
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    }).formatToParts(date).forEach(function (part) { parts[part.type] = part.value; });
    if (!parts.weekday || !parts.month || !parts.day || !parts.hour || !parts.minute || !parts.dayPeriod) return '';
    return parts.weekday + ', ' + parts.month + ' ' + parts.day + ' at ' + parts.hour + ':' +
      parts.minute + ' ' + parts.dayPeriod.toLowerCase() + ' (' + zone.replace(/_/g, ' ') + ')';
  }

  if (name && at) {
    try {
      var when = describe(at);
      if (when) {
        var line = document.getElementById('booked-when');
        line.textContent = name + ' on ' + when + '.';
        line.hidden = false;
      }
    } catch (e) {}
  }

  if (UUID.test(id)) {
    id = id.toLowerCase();
    // Storage that cannot be read counts as empty, and storage that cannot be
    // written is skipped: the booking is still pushed once.
    var seen = [];
    try {
      var stored = JSON.parse(localStorage.getItem(SEEN) || '[]');
      if (Array.isArray(stored)) seen = stored.filter(function (x) { return typeof x === 'string'; });
    } catch (e) {}
    if (seen.indexOf(id) === -1) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'book_appointment',
        booking_type: type,
        booking_name: name,
        event_id: id,
        page_path: '/booked'
      });
      seen.push(id);
      try { localStorage.setItem(SEEN, JSON.stringify(seen.slice(-20))); } catch (e) {}
    }
  }

  if (params.has('id')) {
    try {
      var url = new URL(location.href);
      url.searchParams.delete('id');
      history.replaceState(history.state, '', url.pathname + url.search + url.hash);
    } catch (e) {}
  }
})();
</script>
