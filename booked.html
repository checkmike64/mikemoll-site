<script>
// The CRM sends people here after they book a call. The address says what
// they booked: the meeting type (type), its name, when it starts (at), the
// meeting's id, a one-off token (m), and the visitor key, which /visits.js
// deals with. Every value is checked before it is used and only ever written
// into the page as text. Without a usable time and name, the page shows the
// general confirmation.
//
// book_appointment goes to Tag Manager once per booking: the meeting id is
// the CRM's own id for it, and this browser remembers the last 20 it has
// counted. The id and the token then come out of the address bar, so a reload
// still shows the time but is not a second booking. A visit with no id is not
// a booking and pushes nothing.
//
// For Google Ads enhanced conversions the push also carries user_data: the
// booker's email address and phone number, already hashed by the CRM, which
// hands them over in exchange for the token. The details themselves never
// reach this page. The booking waits at most two seconds for that answer.
// Without one, for whatever reason, it is pushed without user_data, and it is
// still pushed exactly once.
(function () {
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  var TYPE = /^[a-z0-9-]{1,80}$/;
  var TOKEN = /^[A-Za-z0-9._~-]{20,400}$/;
  var HASH = /^[0-9a-f]{64}$/;
  var MATCH = 'https://coaching-crm-tau.vercel.app/api/book/match?m=';
  var SEEN = 'crm_booked';
  var params = new URLSearchParams(location.search);

  var type = params.get('type') || '';
  if (!TYPE.test(type)) type = '';
  var name = (params.get('name') || '').trim();
  if (name.length > 120) name = '';
  var at = params.get('at') ? new Date(params.get('at')) : null;
  if (at && isNaN(at.getTime())) at = null;
  var id = params.get('id') || '';
  var token = params.get('m') || '';

  // "Saturday, October 3 at 3:00 pm (America/New York)", in the visitor's own
  // time zone.
  function describe(date) {
    var zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (!zone) return '';
    var parts = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: zone,
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    }).formatToParts(date).forEach(function (part) { parts[part.type] = part.value; });
    if (!parts.weekday || !parts.month || !parts.day || !parts.hour || !parts.minute || !parts.dayPeriod) return '';
    return parts.weekday + ', ' + parts.month + ' ' + parts.day + ' at ' + parts.hour + ':' +
      parts.minute + ' ' + parts.dayPeriod.toLowerCase() + ' (' + zone.replace(/_/g, ' ') + ')';
  }

  if (name && at) {
    try {
      var when = describe(at);
      if (when) {
        var line = document.getElementById('booked-when');
        line.textContent = name + ' on ' + when + '.';
        line.hidden = false;
      }
    } catch (e) {}
  }

  // Storage that cannot be read counts as empty, and storage that cannot be
  // written is skipped: the booking is still pushed once.
  function seenIds() {
    try {
      var stored = JSON.parse(localStorage.getItem(SEEN) || '[]');
      if (Array.isArray(stored)) return stored.filter(function (x) { return typeof x === 'string'; });
    } catch (e) {}
    return [];
  }

  // The hashes in the CRM's answer, keeping only well-formed ones, or null
  // when there are none.
  function hashesFrom(value) {
    var userData = {};
    if (value && typeof value === 'object') {
      ['sha256_email_address', 'sha256_phone_number'].forEach(function (key) {
        if (typeof value[key] === 'string' && HASH.test(value[key])) userData[key] = value[key];
      });
    }
    return Object.keys(userData).length > 0 ? userData : null;
  }

  // Calls back exactly once: with user_data, or with null for a missing or
  // malformed token, an answer other than 200, a network error, two seconds
  // without an answer, or the visitor leaving the page first.
  function lookUp(token, callback) {
    var finished = false;
    var controller = null;
    var timer = null;
    function finish(userData) {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      window.removeEventListener('pagehide', leave);
      callback(userData);
    }
    function leave() { finish(null); }

    if (!TOKEN.test(token) || !window.fetch) { finish(null); return; }
    try { controller = new AbortController(); } catch (e) {}
    timer = setTimeout(function () {
      finish(null);
      if (controller) controller.abort();
    }, 2000);
    window.addEventListener('pagehide', leave);
    try {
      fetch(MATCH + encodeURIComponent(token), {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store',
        signal: controller ? controller.signal : undefined
      }).then(function (res) {
        if (res.status !== 200) throw new Error('status ' + res.status);
        return res.json();
      }).then(function (body) {
        finish(hashesFrom(body && body.user_data));
      }).catch(function () { finish(null); });
    } catch (e) { finish(null); }
  }

  if (params.has('id') || params.has('m')) {
    try {
      var url = new URL(location.href);
      url.searchParams.delete('id');
      url.searchParams.delete('m');
      history.replaceState(history.state, '', url.pathname + url.search + url.hash);
    } catch (e) {}
  }

  if (UUID.test(id)) {
    id = id.toLowerCase();
    if (seenIds().indexOf(id) === -1) {
      lookUp(token, function (userData) {
        // Checked again, in case another tab counted it while this one waited.
        var seen = seenIds();
        if (seen.indexOf(id) !== -1) return;
        var event = {
          event: 'book_appointment',
          booking_type: type,
          booking_name: name,
          event_id: id,
          page_path: '/booked'
        };
        if (userData) event.user_data = userData;
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push(event);
        seen.push(id);
        try { localStorage.setItem(SEEN, JSON.stringify(seen.slice(-20))); } catch (e) {}
      });
    }
  }
})();
</script>
